name: SMK pad-one baseline Windows
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install pyinstaller==6.16.0 mido==1.3.3 python-rtmidi==1.5.8
      - name: Validate pad-one baseline against captured exchange
        run: python -m unittest discover -s tests -p test_smk_baseline.py -v
      - name: Build accepted pad-one diagnostic
        run: python -m PyInstaller --onefile --windowed --name MeetStep-SMK-Pad-One-Baseline --hidden-import mido.backends.rtmidi tools/smk_led_probe.py
      - uses: actions/upload-artifact@v4
        with:
          name: MeetStep-SMK-Pad-One-Baseline-Windows-x64
          path: dist/MeetStep-SMK-Pad-One-Baseline.exe
          if-no-files-found: error
