name: SMK Simple Pad Colour Windows
on:
  push:
    paths:
      - 'tools/smk_pad_colour.py'
      - 'tools/smk_pad_colour_gui.py'
      - 'tools/SMK-PAD-COLOUR.md'
      - 'tests/test_smk*.py'
      - 'docs/protocol/smk-32-rgb-addresses.json'
      - 'docs/protocol/smk-32-brightness.json'
      - 'docs/protocol/smk-captured-block-write.json'
      - 'docs/protocol/smk-pad-one-working-capture.json'
      - '.github/workflows/pad-colour.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned dependencies
        run: python -m pip install pyinstaller==6.16.0 mido==1.3.3 python-rtmidi==1.5.8
      - name: Test MIDI adapter, captured bytes and GUI
        run: python -m unittest discover -s tests -p "test_smk*.py" -v
      - name: Build simple colour utility
        run: python -m PyInstaller --clean --noconfirm --onefile --windowed --name MeetStep-SMK-Pad-Colour --hidden-import mido.backends.rtmidi tools/smk_pad_colour.py
      - name: Start packaged EXE and verify Tk and RtMidi load
        shell: pwsh
        run: |
          $resultPath = Join-Path $PWD "packaged-smoke.json"
          $exePath = Join-Path $PWD "dist/MeetStep-SMK-Pad-Colour.exe"
          $process = Start-Process -FilePath $exePath -ArgumentList @("--smoke-test", $resultPath) -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw "Packaged GUI smoke test timed out"
          }
          if ($process.ExitCode -ne 0) { throw "Packaged EXE failed: $($process.ExitCode)" }
          if (-not (Test-Path $resultPath)) { throw "Packaged EXE produced no result" }
          $result = Get-Content $resultPath -Raw | ConvertFrom-Json
          if ($result.gui -ne "ok" -or $result.backend -ne "loaded") { throw "Invalid packaged smoke result" }
          Get-Content $resultPath
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory package | Out-Null
          Copy-Item dist/MeetStep-SMK-Pad-Colour.exe package/
          Copy-Item tools/SMK-PAD-COLOUR.md package/README.txt
          git rev-parse HEAD | Out-File package/commit.txt -Encoding utf8
          Get-FileHash package/MeetStep-SMK-Pad-Colour.exe -Algorithm SHA256
      - uses: actions/upload-artifact@v4
        with:
          name: MeetStep-SMK-Pad-Colour-0.3.1-Windows-x64
          path: package/
          if-no-files-found: error
