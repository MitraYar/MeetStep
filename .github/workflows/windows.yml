name: Windows VST3
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Configure Windows x64
        run: cmake -S . -B build -A x64 -DMEETSTEP_BUILD_PLUGIN=ON
      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel 2 2>&1 | Tee-Object -FilePath build-output.log
          $buildExitCode = $LASTEXITCODE
          if ($buildExitCode -ne 0) {
            $errors = @(Select-String -Path build-output.log -Pattern '(?i)(fatal error|error [A-Z]+[0-9]+|error:|unresolved external)' | Select-Object -Last 20)
            if ($errors.Count -eq 0) { $errors = @(Get-Content build-output.log -Tail 20) }
            foreach ($entry in $errors) {
              $message = "$entry".Replace('%', '%25').Replace("`r", '%0D').Replace("`n", '%0A')
              Write-Output "::error title=Windows build::$message"
            }
          }
          exit $buildExitCode
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
      - name: Package plugin
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path package | Out-Null
          Copy-Item build/MeetStep_artefacts/Release/VST3/MeetStep.vst3 package/MeetStep.vst3 -Recurse
          Copy-Item packaging/INSTALL-WINDOWS.txt package/
          Compress-Archive -Path package/* -DestinationPath MeetStep-0.1.0-Windows-x64.zip
          Get-FileHash MeetStep-0.1.0-Windows-x64.zip -Algorithm SHA256 | Format-List
      - uses: actions/upload-artifact@v4
        with:
          name: MeetStep-0.1.0-Windows-x64
          path: MeetStep-0.1.0-Windows-x64.zip
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: MeetStep-editor-screenshot
          path: build/meetstep-editor.png
          if-no-files-found: error
